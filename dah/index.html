<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D.A.H. Digital Art Hub</title>
<meta name="description" content="One endless shared wall of art. Find a free spot, hang a picture a day, and explore everyone else's by coordinates.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c2187a'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* Layout: a surveyor's chart that fills the screen; every control floats over the map, and rulers frame its top and left edges. */
:root{
  --paper:#e9eff2;--paper-2:#f7fafb;--ink:#14293a;--ink-2:#4e6476;--line:#14293a1c;--line-2:#14293a3d;
  --chart:#c2187a;--chart-ink:#ffffff;--danger:#b3261e;--shadow:0 8px 30px #14293a2e;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ruler:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1c29;--paper-2:#172a3a;--ink:#dfeaf1;--ink-2:#93a9b9;--line:#dfeaf114;--line-2:#dfeaf130;
  --chart:#ff5cb4;--chart-ink:#2a0519;--danger:#ff8a80;--shadow:0 8px 30px #0009;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1c29;--paper-2:#172a3a;--ink:#dfeaf1;--ink-2:#93a9b9;--line:#dfeaf114;--line-2:#dfeaf130;
  --chart:#ff5cb4;--chart-ink:#2a0519;--danger:#ff8a80;--shadow:0 8px 30px #0009;color-scheme:dark}
html,body{height:100%;overflow:hidden;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:14px var(--body);overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chart);outline-offset:2px}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#stage.drag{cursor:grabbing}
#grid,#over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#over{z-index:3}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;z-index:2}
.piece,.mark,.ghost{position:absolute;padding:0;border:0;background:var(--paper-2);box-shadow:0 1px 0 var(--line-2),0 6px 20px #0003}
.piece{cursor:pointer}
.piece img,.mark img,.ghost img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.piece:hover,.piece:focus-visible,.mark:hover{outline:3px solid var(--chart);outline-offset:0}
.piece .plaque{position:absolute;left:0;top:100%;margin-top:8px;width:max-content;max-width:max(100%,320px);font:500 20px/1.3 var(--mono);color:var(--ink);text-align:left;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece .plaque b{font-family:var(--body);font-weight:600}
.piece .plaque i{font-style:normal;color:var(--ink-2)}
#world.far .plaque{display:none}
#world.overview .piece{display:none}
#marks{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#marks .mark{pointer-events:auto}
.check{display:flex;gap:8px;align-items:flex-start;line-height:1.35;cursor:pointer}
.check input{margin:2px 0 0;width:16px;height:16px;flex:none;accent-color:var(--chart)}
.piece.missing::after{content:"Image unavailable";position:absolute;inset:0;display:grid;place-items:center;font:12px var(--mono);color:var(--ink-2);border:1px dashed var(--line-2)}
.mark{cursor:pointer;border-radius:2px}
.ghost{outline:3px dashed var(--chart);outline-offset:3px;cursor:move;z-index:5;touch-action:none}
.ghost.clash{outline-color:var(--danger)}
.float{position:fixed;z-index:6;background:var(--paper-2);border:1px solid var(--line-2);box-shadow:var(--shadow)}
#bar{top:calc(var(--ruler) + 12px + env(safe-area-inset-top,0px));left:calc(var(--ruler) + 12px + env(safe-area-inset-left,0px));right:calc(12px + env(safe-area-inset-right,0px));max-width:max-content;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:7px 8px 7px 14px}
#bar h1{margin:0;font:800 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
#counter{display:flex;align-items:baseline;gap:5px;padding-left:14px;border-left:1px solid var(--line-2);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
#count{font:800 26px/1 var(--display);letter-spacing:.01em;color:var(--chart);font-variant-numeric:tabular-nums}
#goto{display:flex;align-items:center;gap:6px}
#goto label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#gotoInput{width:130px;height:32px;padding:0 8px;background:var(--paper);border:1px solid var(--line-2);font:13px var(--mono);border-radius:0;min-width:0}
.btn{height:32px;padding:0 11px;background:transparent;border:1px solid var(--line-2);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--chart);color:var(--chart-ink);border-color:var(--chart)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:var(--danger)}
#hud{left:calc(var(--ruler) + 12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;padding:7px 10px;font:12px/1.4 var(--mono);font-variant-numeric:tabular-nums;max-width:calc(100vw - var(--ruler) - 24px)}
#hud b{font-weight:500;color:var(--chart)}
#status{color:var(--ink-2)}
#zoom{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(144px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#zoom button{width:38px;height:36px;background:none;border:0;font:500 15px var(--mono)}
#zoom button+button{border-top:1px solid var(--line-2)}
#zoom button:hover{background:var(--paper)}
#mini{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:180px;height:122px;display:block;cursor:crosshair}
#panel{top:calc(var(--ruler) + 12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:340px;max-width:calc(100vw - 24px);z-index:8;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;overscroll-behavior:contain}
#panel h2{margin:0;font:800 28px/1.05 var(--display);letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
#panel .thumb{width:100%;max-height:240px;object-fit:contain;background:var(--paper);display:block}
#panel p{margin:0;line-height:1.45;overflow-wrap:anywhere}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea{width:100%;padding:7px 8px;background:var(--paper);border:1px solid var(--line-2);border-radius:0;box-sizing:border-box;resize:vertical}
.field input[type=range]{padding:0;border:0;background:none;accent-color:var(--chart)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.coords{font:500 15px var(--mono);color:var(--chart);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--ink-2)}
.warn{font-size:13px;color:var(--danger)}
#empty{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 48px));padding:18px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#empty h2{margin:0;font:800 30px/1.05 var(--display);text-wrap:balance}
#empty p{margin:0;line-height:1.45}
#toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px 12px;background:var(--ink);color:var(--paper);font-size:13px;max-width:calc(100vw - 32px)}
#dropveil{position:fixed;inset:10px;z-index:10;border:3px dashed var(--chart);pointer-events:none;display:grid;place-items:center;font:800 34px var(--display);color:var(--chart);background:color-mix(in srgb,var(--paper) 72%,transparent);text-align:center}
@media (max-width:640px){
  #mini,#zoom{display:none}
  #panel{top:auto;left:calc(12px + env(safe-area-inset-left,0px));width:auto;max-height:62%}
  #gotoInput{width:96px}
  #goto label{display:none}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>

<div id="stage" aria-label="Art map. Drag or scroll to move, pinch or Control-scroll to zoom.">
  <canvas id="grid"></canvas>
  <div id="world"></div>
  <div id="marks"></div>
  <canvas id="over"></canvas>
</div>

<header id="bar" class="float">
  <h1 title="Digital Art Hub">D.A.H.<span style="display:block;margin-top:2px;font:500 9px/1 var(--mono);letter-spacing:.08em;color:var(--ink-2);white-space:nowrap">Digital Art Hub</span></h1>
  <div id="counter" aria-live="polite"><b id="count">—</b> <span id="countLabel">images</span></div>
  <form id="goto">
    <label for="gotoInput">Go to</label>
    <input id="gotoInput" placeholder="x, y" autocomplete="off" inputmode="text">
    <button class="btn" type="submit">Go</button>
  </form>
  <button class="btn" id="homeBtn" type="button" title="Back to 0, 0 (key: 0)">Origin</button>
  <button class="btn" id="wanderBtn" type="button" title="Jump to a random piece (key: R)">Wander</button>
  <button class="btn primary" id="addBtn" type="button">Hang your picture</button>
  <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
</header>

<div id="hud" class="float" aria-live="off">
  <div>cursor <b id="cur">0, 0</b></div>
  <div>view <span id="view">0, 0</span> · <span id="zl">100%</span></div>
  <div id="status">Connecting to the wall…</div>
</div>

<div id="zoom" class="float">
  <button id="zin" type="button" aria-label="Zoom in">+</button>
  <button id="zout" type="button" aria-label="Zoom out">−</button>
</div>
<canvas id="mini" class="float" width="360" height="244" aria-label="Overview map. Select a point to jump there." role="img"></canvas>

<section id="empty" class="float" hidden>
  <div class="eyebrow">Origin · 0, 0</div>
  <h2>The wall is empty</h2>
  <p id="emptyText">Art appears here as people add it.</p>
  <div class="row"><button class="btn primary" id="emptyAdd" type="button">Hang the first piece</button></div>
</section>

<aside id="panel" class="float" hidden></aside>
<div id="toast" role="status" hidden></div>
<div id="dropveil" hidden>Drop to hang it here</div>

<script src="../vendor/supabase.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const REGION = 2048, MAX_SIDE = 2000, THUMB = 480, MAX_DIM = 2560, LIMIT = 9e15; // about as far as exact whole-number coordinates go
const DAY = 864e5, GAP = 12;
const MIN_Z = .00001, MAX_Z = 6, MAX_SUBS = 48, MAX_WANTED = 40;
const TYPES = new Set(["image/png","image/jpeg","image/gif","image/webp"]);
const ASSET_PATH = /^[0-9a-f-]{36}\/(full|thumb)\.(png|jpg|gif|webp)$/;
const stage=$("stage"), world=$("world"), grid=$("grid"), over=$("over"), mini=$("mini"), panel=$("panel");
const gctx=grid.getContext("2d"), octx=over.getContext("2d"), mctx=mini.getContext("2d");

const cam = {x:0,y:0,z:.6};
const org = {x:0,y:0}; // pictures are positioned relative to this, so they stay sharp however far out you travel
let W=innerWidth, H=innerHeight, dpr=1, css={}, cursor=null;
let sb=null, device="", me={owner:null}, hereNow=0, setupMissing=false;
let canHang=false, indexReady=false, indexFailed=false, connecting=true;
const SB_URL="https://aexdkcpiljcfkogibcwy.supabase.co", SB_KEY="sb_publishable_kLNWgcj4oW9xsAw44QKuTg_AkITuR_Z", BUCKET="dah";
const regions=new Map(), pieces=new Map(), els=new Map(), marks=new Map(), subs=new Map();
let total=null, nextAt=0, peers=[], placing=null, queue=[], selected=null;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- small helpers ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=v=>typeof v==="number"&&Number.isFinite(v);
const fmt=n=>{const r=Math.round(n);return (r===0?0:r).toLocaleString("en-US").replace("-","−")};
const pair=(x,y)=>`${fmt(x)}, ${fmt(y)}`;
const plain=(x,y)=>`${Math.round(x)}, ${Math.round(y)}`;
const rid=(x,y)=>`r${Math.floor(x/REGION)}_${Math.floor(y/REGION)}`;
const blob=path=>`${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
const store={get(k){try{return localStorage.getItem(k)||""}catch{return""}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const k in props){if(k==="class")e.className=props[k];else if(k==="text")e.textContent=props[k];else e[k]=props[k]}e.append(...kids);return e};
let toastT; function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3600)}
async function copy(text,done){try{await navigator.clipboard.writeText(text);toast(done)}catch{toast(`Copy this: ${text}`)}}
const toScreen=(x,y)=>[(x-cam.x)*cam.z+W/2,(cam.y-y)*cam.z+H/2];
const toWorld=(sx,sy)=>[(sx-W/2)/cam.z+cam.x,cam.y-(sy-H/2)/cam.z];

/* ---------- camera and drawing ---------- */
let queued=false;
function draw(){if(!queued){queued=true;requestAnimationFrame(frame)}}
function frame(){queued=false;world.style.transform=`translate(${W/2-(cam.x-org.x)*cam.z}px,${H/2+(cam.y-org.y)*cam.z}px) scale(${cam.z})`;
  drawGrid();drawOver();drawMini();cull();updateHud()}
function readCss(){const s=getComputedStyle(document.documentElement);for(const k of["paper","paper-2","ink","ink-2","line","line-2","chart"])css[k]=s.getPropertyValue("--"+k).trim();draw()}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);for(const c of[grid,over]){c.width=W*dpr;c.height=H*dpr}draw();planSubs()}
function step(z,minPx){const raw=minPx/z,p=10**Math.floor(Math.log10(raw));for(const m of[1,2,5,10])if(m*p>=raw)return m*p;return 10*p}
function drawGrid(){
  const c=gctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const major=step(cam.z,90),minor=major/5;
  const [x0,y1]=toWorld(0,0),[x1,y0]=toWorld(W,H);
  const lines=(s,col)=>{c.strokeStyle=col;c.lineWidth=1;c.beginPath();
    for(let x=Math.ceil(x0/s)*s;x<=x1;x+=s){const p=Math.round(toScreen(x,0)[0])+.5;c.moveTo(p,0);c.lineTo(p,H)}
    for(let y=Math.ceil(y0/s)*s;y<=y1;y+=s){const p=Math.round(toScreen(0,y)[1])+.5;c.moveTo(0,p);c.lineTo(W,p)}c.stroke()};
  if(minor*cam.z>=12)lines(minor,css.line);
  lines(major,css["line-2"]);
  const [ox,oy]=toScreen(0,0);
  c.strokeStyle=css.chart;c.lineWidth=1.5;c.beginPath();
  if(ox>=0&&ox<=W){c.moveTo(ox,0);c.lineTo(ox,H)} if(oy>=0&&oy<=H){c.moveTo(0,oy);c.lineTo(W,oy)}c.stroke();
  if(ox>-20&&ox<W+20&&oy>-20&&oy<H+20){c.beginPath();c.arc(ox,oy,7,0,7);c.stroke();c.fillStyle=css.chart;c.font="500 12px 'DM Mono',monospace";c.fillText("0, 0",ox+12,oy-10)}
}
function drawOver(){
  const c=octx,R=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--ruler"))||26;
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  // Other people looking at the wall right now
  c.font="500 11px 'DM Mono',monospace";
  for(const p of peers){ if(p.sameTab)continue; const q=p.presence||{}; if(!num(q.x)||!num(q.y))continue;
    const [sx,sy]=toScreen(q.x,q.y); if(sx<0||sx>W||sy<0||sy>H)continue;
    const col=typeof q.c==="string"&&/^#[0-9a-f]{3,8}$/i.test(q.c)?q.c:css.chart;
    c.fillStyle=col;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+3,sy+13);c.lineTo(sx+6,sy+8);c.lineTo(sx+12,sy+7);c.closePath();c.fill();
    c.fillText(plain(q.x,q.y),sx+13,sy+18);
  }
  // Rulers
  c.fillStyle=css["paper-2"];c.fillRect(0,0,W,R);c.fillRect(0,0,R,H);
  c.strokeStyle=css["line-2"];c.fillStyle=css["ink-2"];c.lineWidth=1;c.beginPath();c.moveTo(0,R+.5);c.lineTo(W,R+.5);c.moveTo(R+.5,0);c.lineTo(R+.5,H);
  const major=step(cam.z,90),minor=major/5,[x0,y1]=toWorld(0,0),[x1,y0]=toWorld(W,H);
  for(let x=Math.ceil(x0/minor)*minor;x<=x1;x+=minor){const p=Math.round(toScreen(x,0)[0])+.5;if(p<R)continue;c.moveTo(p,R);c.lineTo(p,R-(Math.abs(x/major-Math.round(x/major))<1e-6?10:4))}
  for(let y=Math.ceil(y0/minor)*minor;y<=y1;y+=minor){const p=Math.round(toScreen(0,y)[1])+.5;if(p<R)continue;c.moveTo(R,p);c.lineTo(R-(Math.abs(y/major-Math.round(y/major))<1e-6?10:4),p)}
  c.stroke();
  c.font="10.5px 'DM Mono',monospace";c.textBaseline="alphabetic";
  for(let x=Math.ceil(x0/major)*major;x<=x1;x+=major){const p=toScreen(x,0)[0];if(p<R+4)continue;c.fillText(short(x,major),p+4,12)}
  c.save();
  for(let y=Math.ceil(y0/major)*major;y<=y1;y+=major){const p=toScreen(0,y)[1];if(p<R+40)continue;c.save();c.translate(12,p-4);c.rotate(-Math.PI/2);c.fillText(short(y,major),0,0);c.restore()}
  c.restore();
  // Cursor ticks on the rulers
  if(cursor){c.fillStyle=css.chart;const [sx,sy]=toScreen(cursor[0],cursor[1]);
    if(sx>R)c.fillRect(sx-.75,0,1.5,R); if(sy>R)c.fillRect(0,sy-.75,R,1.5)}
  c.fillStyle=css["paper-2"];c.fillRect(0,0,R,R);
}
function short(v,major){const a=Math.abs(v),s=v<0?"−":"";for(const [k,u] of [[1e15,"Q"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"k"]])if(major>=k)return s+(a/k).toLocaleString("en-US")+u;return s+(Math.round(a*100)/100).toLocaleString("en-US")}
function drawMini(){
  if(mini.offsetParent===null&&getComputedStyle(mini).display==="none")return;
  const c=mctx,mw=mini.width,mh=mini.height;c.setTransform(1,0,0,1,0,0);c.fillStyle=css["paper-2"];c.fillRect(0,0,mw,mh);
  const vw=W/cam.z,vh=H/cam.z;let a=cam.x-vw/2,b=cam.x+vw/2,d=cam.y-vh/2,e=cam.y+vh/2;
  a=Math.min(a,-500);b=Math.max(b,500);d=Math.min(d,-340);e=Math.max(e,340);
  for(const r of regions.values()){a=Math.min(a,r.x);b=Math.max(b,r.x);d=Math.min(d,r.y);e=Math.max(e,r.y)}
  const pad=.08*Math.max(b-a,(e-d)*mw/mh),s=Math.min(mw/(b-a+pad*2),mh/(e-d+pad*2)),mx=(a+b)/2,my=(d+e)/2;
  miniMap={s,mx,my,mw,mh};
  const X=x=>(x-mx)*s+mw/2,Y=y=>(my-y)*s+mh/2;
  c.strokeStyle=css["line-2"];c.lineWidth=1;c.beginPath();c.moveTo(X(0),0);c.lineTo(X(0),mh);c.moveTo(0,Y(0));c.lineTo(mw,Y(0));c.stroke();
  c.fillStyle=css.ink;for(const r of regions.values())c.fillRect(X(r.x)-3,Y(r.y)-3,6,6);
  c.strokeStyle=css.chart;c.lineWidth=2.5;c.strokeRect(X(cam.x-vw/2),Y(cam.y+vh/2),Math.max(4,vw*s),Math.max(4,vh*s));
}
let miniMap=null;
function updateHud(){
  $("cur").textContent=cursor?pair(cursor[0],cursor[1]):"—";
  $("view").textContent=pair(cam.x,cam.y);
  $("zl").textContent=(cam.z<.1?Number((cam.z*100).toPrecision(2)):Math.round(cam.z*100))+"%";
}
function moveTo(x,y,z=cam.z){cam.x=clamp(x,-LIMIT,LIMIT);cam.y=clamp(y,-LIMIT,LIMIT);cam.z=clamp(z,MIN_Z,MAX_Z);
  if(Math.abs(cam.x-org.x)>50000||Math.abs(cam.y-org.y)>50000){org.x=Math.round(cam.x);org.y=Math.round(cam.y);if(placing)setGhost(placing.x,placing.y)}
  world.classList.toggle("far",cam.z<.32);draw();planSubs();saveHash()}
let flying=0;
function fly(x,y,z=cam.z){
  const id=++flying;
  if(reduced){moveTo(x,y,z);return}
  const s={...cam},t0=performance.now(),D=650;
  const tick=t=>{if(id!==flying)return;const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-(-2*k+2)**2/2;
    moveTo(s.x+(x-s.x)*e,s.y+(y-s.y)*e,Math.exp(Math.log(s.z)+(Math.log(z)-Math.log(s.z))*e));if(k<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function zoomAt(factor,sx=W/2,sy=H/2){flying++;const [wx,wy]=toWorld(sx,sy),z=clamp(cam.z*factor,MIN_Z,MAX_Z);
  moveTo(wx-(sx-W/2)/z,wy+(sy-H/2)/z,z)}

/* ---------- position in the link ---------- */
let hashT;
const enc=n=>{const r=Math.round(n);return r<0?"n"+(-r):""+r};
const dec=s=>s[0]==="n"?-Number(s.slice(1)):Number(s);
function saveHash(){clearTimeout(hashT);hashT=setTimeout(()=>{try{history.replaceState(null,"",`#at-${enc(cam.x)}-${enc(cam.y)}-u${Math.round(cam.z*1e6)}`)}catch{}},500)}
function readHash(){const m=/^#at-(n?\d+)-(n?\d+)(?:-(z|u)(\d+))?$/.exec(location.hash);return m?{x:dec(m[1]),y:dec(m[2]),z:m[4]?Number(m[4])/(m[3]==="u"?1e6:1e3):null}:null}
addEventListener("hashchange",()=>{const h=readHash();if(h&&(Math.abs(h.x-cam.x)>1||Math.abs(h.y-cam.y)>1))fly(h.x,h.y,h.z||cam.z)});

/* ---------- pieces on the wall ---------- */
function clean(d){
  if(!d||typeof d.id!=="string"||!num(d.x)||!num(d.y)||!num(d.w)||!num(d.h)||typeof d.img!=="string"||!ASSET_PATH.test(d.img))return null;
  const str=(v,n)=>typeof v==="string"?v.slice(0,n):"";
  return {id:d.id,x:d.x,y:d.y,w:clamp(d.w,8,MAX_SIDE),h:clamp(d.h,8,MAX_SIDE),img:d.img,thumb:typeof d.thumb==="string"&&ASSET_PATH.test(d.thumb)?d.thumb:d.img,
    dl:d.dl===true,title:str(d.title,120)||"Untitled",artist:str(d.artist,80),note:str(d.note,600),owner:typeof d.owner==="string"?d.owner:null,at:Date.parse(d.created_at)||0};
}
function setSrc(img,src){if(img.dataset.src!==src){img.dataset.src=src;img.src=src}}
function pieceEl(p){
  let e=els.get(p.id);
  if(!e){
    const img=el("img",{alt:"",draggable:false,decoding:"async"});
    const plaque=el("span",{class:"plaque"});
    e=el("button",{class:"piece",type:"button"},img,plaque);
    img.onerror=()=>e.classList.add("missing");
    img.onload=()=>e.classList.remove("missing");
    e.addEventListener("click",()=>{if(!dragged&&!placing)openDetail(e.dataset.id)});
    els.set(p.id,e);
  }
  e.dataset.id=p.id;
  e.style.cssText=`left:${p.x-org.x-p.w/2}px;top:${-(p.y-org.y)-p.h/2}px;width:${p.w}px;height:${p.h}px`;
  e.setAttribute("aria-label",`${p.title}${p.artist?" by "+p.artist:""} at ${plain(p.x,p.y)}`);
  const plaque=e.querySelector(".plaque");plaque.replaceChildren(el("b",{text:p.title}),document.createTextNode(p.artist?` · ${p.artist}`:""),el("i",{text:`  ${plain(p.x,p.y)}`}));
  return e;
}
function cull(){
  const overview=world.classList.contains("overview");
  const [x0,y1]=toWorld(-100,-100),[x1,y0]=toWorld(W+100,H+100);
  if(!overview){
    for(const p of pieces.values()){
      const seen=p.x+p.w/2>x0&&p.x-p.w/2<x1&&p.y+p.h/2>y0&&p.y-p.h/2<y1;
      let e=els.get(p.id);
      if(seen){e=pieceEl(p);if(!e.isConnected)world.append(e);
        const img=e.firstChild, wantFull=p.w*cam.z*(devicePixelRatio||1)>THUMB*1.1;
        setSrc(img,blob(wantFull?p.img:p.thumb));
      }else if(e&&e.isConnected&&e!==document.activeElement)e.remove();
    }
  }
  const cells=new Set();
  for(const r of regions.values()){
    let e=marks.get(r.id);
    let seen=overview&&r.x>x0-400/cam.z&&r.x<x1+400/cam.z&&r.y>y0-400/cam.z&&r.y<y1+400/cam.z;
    if(seen){const [cx,cy]=toScreen(r.x,r.y),key=Math.round(cx/64)+":"+Math.round(cy/64);if(cells.has(key))seen=false;else cells.add(key)}
    if(!seen){if(e&&e.isConnected)e.remove();continue}
    if(!e){const img=el("img",{alt:"",draggable:false,decoding:"async"});e=el("button",{class:"mark",type:"button"},img);
      e.setAttribute("aria-label","Art cluster. Select to zoom in.");
      e.addEventListener("click",()=>{if(dragged)return;const q=regions.get(e.dataset.rid);if(q)fly(q.x,q.y,.5)});marks.set(r.id,e)}
    e.dataset.rid=r.id;
    const big=Math.max(r.w,r.h),side=Math.max(big*cam.z,54),w=r.w/big*side,h=r.h/big*side,[sx,sy]=toScreen(r.x,r.y);
    e.style.cssText=`left:${sx-w/2}px;top:${sy-h/2}px;width:${w}px;height:${h}px`;
    setSrc(e.firstChild,blob(r.thumb));
    if(!e.isConnected)$("marks").append(e);
  }
}
function removeEl(id){const e=els.get(id);if(e){e.remove();els.delete(id)}}

/* ---------- live data: load the part of the wall in view, then keep it fresh ---------- */
function setStatus(t){$("status").textContent=t}
function refreshStatus(){
  if(setupMissing)return setStatus("The wall is still being set up.");
  if(indexFailed)return setStatus("Can't reach the wall right now. Retrying…");
  if(connecting)return;
  const parts=[cooldown()?`Next picture in ${waitText()}`:"You can hang 1 picture today"];
  if(hereNow>1)parts.push(`${hereNow} here now`);
  setStatus(parts.join(" · "));
}
function failed(err){
  const c=err&&err.code;
  if(c==="42P01"||c==="PGRST205"||c==="PGRST202")setupMissing=true;else indexFailed=true;
  connecting=false;refreshStatus();updateEmpty();refreshAdd();
}
function addIndex(d){if(!d||!num(d.x)||!num(d.y)||!num(d.w)||!num(d.h)||typeof d.thumb!=="string"||!ASSET_PATH.test(d.thumb))return;
  regions.set(d.id,{id:d.id,x:d.x,y:d.y,w:d.w,h:d.h,thumb:d.thumb,at:Date.parse(d.created_at)||0})}
async function loadIndex(){
  const {data,error}=await sb.from("dah_pieces").select("id,x,y,w,h,thumb,created_at").order("created_at",{ascending:false}).limit(1000);
  if(error)return failed(error);
  regions.clear();for(const d of data)addIndex(d);
  for(const [id,e] of marks)if(!regions.has(id)){e.remove();marks.delete(id)}
  indexReady=true;indexFailed=false;setupMissing=false;connecting=false;
  refreshStatus();updateEmpty();refreshAdd();draw();
}
async function loadCount(){
  const {count,error}=await sb.from("dah_pieces").select("id",{count:"exact",head:true});
  if(!error&&num(count)){total=count;refreshCount()}
}
let loaded=null,loadId=0;
async function loadView(force){
  const [x0,y1]=toWorld(0,0),[x1,y0]=toWorld(W,H),pad=Math.max(x1-x0,y1-y0)*.5+MAX_SIDE/2;
  if(!force&&loaded&&x0-MAX_SIDE/2>=loaded.a&&x1+MAX_SIDE/2<=loaded.b&&y0-MAX_SIDE/2>=loaded.c&&y1+MAX_SIDE/2<=loaded.d)return;
  const box={a:x0-pad,b:x1+pad,c:y0-pad,d:y1+pad},id=++loadId;
  const {data,error}=await sb.from("dah_pieces").select("id,x,y,w,h,img,thumb,title,artist,note,dl,owner,created_at")
    .gte("x",box.a).lte("x",box.b).gte("y",box.c).lte("y",box.d).order("created_at",{ascending:false}).limit(800);
  if(id!==loadId)return;
  if(error)return failed(error);
  loaded=box;
  const seen=new Set();
  for(const d of data){const p=clean(d);if(p){pieces.set(p.id,p);seen.add(p.id)}}
  for(const p of [...pieces.values()])if(!seen.has(p.id)&&p.x>=box.a&&p.x<=box.b&&p.y>=box.c&&p.y<=box.d){pieces.delete(p.id);removeEl(p.id);if(selected===p.id)closePanel()}
  updateEmpty();draw();
}
let refreshT;
function soon(){clearTimeout(refreshT);refreshT=setTimeout(()=>{loadIndex();loadCount()},400)}
function subscribeLive(){
  const ch=sb.channel("dah-wall",{config:{presence:{key:me.owner||"visitor"}}});
  ch.on("postgres_changes",{event:"*",schema:"public",table:"dah_pieces"},e=>{
    if(e.eventType==="DELETE"){const id=e.old&&e.old.id;if(id){pieces.delete(id);removeEl(id);regions.delete(id);const m=marks.get(id);if(m){m.remove();marks.delete(id)}if(selected===id)closePanel()}}
    else{const p=clean(e.new);if(p){const isNew=e.eventType==="INSERT"&&p.owner!==me.owner;pieces.set(p.id,p);addIndex(e.new);if(isNew)toast(`New picture at ${plain(p.x,p.y)}: ${p.title}`)}}
    soon();draw();
  });
  ch.on("presence",{event:"sync"},()=>{hereNow=Object.keys(ch.presenceState()).length;refreshStatus()});
  ch.subscribe(s=>{if(s==="SUBSCRIBED")ch.track({at:Date.now()}).catch(()=>{})});
  // A safety net for moments the live connection drops.
  setInterval(()=>{if(document.visibilityState==="visible"){loadCount();loadIndex();if(!world.classList.contains("overview"))loadView(true)}},45000);
}
let planT;
function planSubs(){clearTimeout(planT);planT=setTimeout(syncSubs,120)}
function syncSubs(){
  const [x0,y1]=toWorld(0,0),[x1,y0]=toWorld(W,H);
  // Past this zoom individual pictures are specks, so show the overview instead of loading them all.
  const overview=(x1-x0)*(y1-y0)>30000*30000;
  world.classList.toggle("overview",overview);
  draw();
  if(sb&&!overview)loadView();
}
function refreshCount(){
  if(total===null)return;
  $("count").textContent=total.toLocaleString("en-US");$("countLabel").textContent=total===1?"image":"images";
}
function cooldown(){return Math.max(0,nextAt-Date.now())}
function waitText(){const m=Math.ceil(cooldown()/6e4),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`}
function refreshAdd(){
  const b=$("addBtn"),left=cooldown(),ok=canHang&&!setupMissing;
  b.disabled=!ok||left>0;
  b.textContent=ok&&left?`Next picture in ${waitText()}`:"Hang your picture";
  b.title=!ok?noHangReason():left?"Everyone can hang one picture every 24 hours.":"";
  refreshStatus();updateEmpty();
}
async function loadStatus(){
  const {data,error}=await sb.rpc("dah_status",{p_device:device});
  if(!error&&num(data)){nextAt=data>0?Date.now()+data*1000:0;refreshAdd()}
}
function updateEmpty(){
  const box=$("empty");
  const known=regions.size>0||pieces.size>0;
  const show=!known&&!placing&&(indexReady||setupMissing||!sb);
  box.hidden=!show;
  $("emptyAdd").hidden=!canHang||setupMissing||cooldown()>0;
  $("emptyText").textContent=setupMissing
    ?"D.A.H. is almost ready. Its database is still being set up, so check back soon."
    :!sb?"The wall couldn't load. Check your connection and reload the page."
    :"Everyone shares this one wall. Pick a free spot for your picture. You can add one every 24 hours.";
}

/* ---------- moving around ---------- */
let dragged=false, ptrs=new Map(), pinch=null, last=null, ghostDrag=null;
stage.addEventListener("pointerdown",e=>{
  if(e.button>0&&e.pointerType==="mouse")return;
  flying++;dragged=false;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(placing&&e.target.closest&&e.target.closest(".ghost")){ghostDrag={id:e.pointerId};stage.setPointerCapture(e.pointerId);return}
  last=[e.clientX,e.clientY];
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z};dragged=true}
});
stage.addEventListener("pointermove",e=>{
  cursor=toWorld(e.clientX,e.clientY);
  if(ghostDrag&&ghostDrag.id===e.pointerId){dragged=true;setGhost(cursor[0],cursor[1]);draw();return}
  if(!ptrs.has(e.pointerId)){draw();return}
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size>=2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;zoomAt(pinch.z*(d/pinch.d)/cam.z,mx,my);return}
  if(!last)return;
  const dx=e.clientX-last[0],dy=e.clientY-last[1];
  if(!dragged&&Math.hypot(dx,dy)<5)return;
  if(!dragged){dragged=true;stage.classList.add("drag");try{stage.setPointerCapture(e.pointerId)}catch{}}
  last=[e.clientX,e.clientY];
  moveTo(cam.x-dx/cam.z,cam.y+dy/cam.z);
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ghostDrag&&ghostDrag.id===e.pointerId)ghostDrag=null;
  if(ptrs.size===0){stage.classList.remove("drag");last=null;setTimeout(()=>dragged=false,0)}else{last=[...ptrs.values()][0]}};
stage.addEventListener("pointerup",endPtr);stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("pointerleave",()=>{if(!ptrs.size){cursor=null;draw()}});
stage.addEventListener("wheel",e=>{e.preventDefault();flying++;
  if(e.ctrlKey||e.metaKey){zoomAt(Math.exp(-e.deltaY*.01),e.clientX,e.clientY)}
  else{const u=e.deltaMode===1?18:1;moveTo(cam.x+e.deltaX*u/cam.z,cam.y-e.deltaY*u/cam.z)}
},{passive:false});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(placing)cancelPlacing();else if(!panel.hidden)closePanel();return}
  if(e.target.closest&&e.target.closest("input,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  const s=140/cam.z;
  const act={ArrowLeft:()=>moveTo(cam.x-s,cam.y),ArrowRight:()=>moveTo(cam.x+s,cam.y),ArrowUp:()=>moveTo(cam.x,cam.y+s),ArrowDown:()=>moveTo(cam.x,cam.y-s),
    "+":()=>zoomAt(1.25),"=":()=>zoomAt(1.25),"-":()=>zoomAt(.8),"0":()=>fly(0,0,.6),r:wander,R:wander,g:()=>$("gotoInput").focus(),G:()=>$("gotoInput").focus()}[e.key];
  if(act){e.preventDefault();act()}
});
$("zin").onclick=()=>zoomAt(1.4);$("zout").onclick=()=>zoomAt(1/1.4);
$("homeBtn").onclick=()=>fly(0,0,.6);$("wanderBtn").onclick=wander;
function wander(){const list=[...regions.values()];if(!list.length){toast("There's no art to wander to yet.");return}
  const r=list[Math.floor(Math.random()*list.length)];fly(r.x,r.y,.55)}
$("goto").addEventListener("submit",e=>{e.preventDefault();const input=$("gotoInput");
  const m=/^\s*\(?\s*(-?[\d,]*\d(?:\.\d+)?)\s*[,;\s]\s*(-?\d[\d,]*(?:\.\d+)?)\s*\)?\s*$/.exec(input.value.replace(/−/g,"-"));
  if(!m){toast("Enter coordinates as x, y. For example: 1200, -340");input.select();return}
  const x=Number(m[1].replace(/,/g,"")),y=Number(m[2].replace(/,/g,""));
  if(Math.abs(x)>LIMIT||Math.abs(y)>LIMIT){toast("Those numbers are too big to land on exactly. Try something under 9 quadrillion.");return}
  fly(x,y,Math.max(cam.z,.4));input.blur();
});
mini.addEventListener("click",e=>{if(!miniMap)return;const b=mini.getBoundingClientRect(),m=miniMap;
  const px=(e.clientX-b.left)*m.mw/b.width,py=(e.clientY-b.top)*m.mh/b.height;
  fly((px-m.mw/2)/m.s+m.mx,m.my-(py-m.mh/2)/m.s)});

/* ---------- viewing one piece ---------- */
function closePanel(){panel.hidden=true;panel.replaceChildren();selected=null}
function openDetail(id){
  const p=pieces.get(id);if(!p)return;selected=id;
  const mine=!!me.owner&&p.owner===me.owner;
  const thumb=el("img",{class:"thumb",alt:p.title,src:blob(p.img)});
  const close=el("button",{class:"btn",type:"button",text:"Close",onclick:closePanel});
  const cp=el("button",{class:"btn",type:"button",text:"Copy coordinates",onclick:()=>copy(plain(p.x,p.y),`Copied ${plain(p.x,p.y)}. Paste it into Go to.`)});
  const fit=el("button",{class:"btn",type:"button",text:"Fit to screen",onclick:()=>{const z=clamp(Math.min((W-420)/p.w,(H-120)/p.h),.05,MAX_Z);fly(p.x,p.y,W>700?z:Math.min(W/p.w,H/p.h)*.8)}});
  const kids=[el("div",{class:"eyebrow",text:"On the wall"}),el("h2",{text:p.title}),thumb,el("div",{class:"coords",text:pair(p.x,p.y)})];
  if(p.artist)kids.push(el("p",{text:`By ${p.artist}`}));
  if(p.note)kids.push(el("p",{text:p.note}));
  if(p.at)kids.push(el("div",{class:"note",text:`Hung ${new Date(p.at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})} · ${Math.round(p.w)} × ${Math.round(p.h)} units`}));
  const row=el("div",{class:"row"},fit,cp,close);
  if(p.dl)row.prepend(el("button",{id:"dlBtn",class:"btn primary",type:"button",text:"Download",onclick:()=>download(p)}));
  kids.push(row);
  if(!p.dl)kids.push(el("div",{class:"note",text:"The artist hasn't turned on downloads for this picture."}));
  if(mine){
    const box=el("input",{id:"dlToggle",type:"checkbox",checked:p.dl});
    box.onchange=async()=>{box.disabled=true;try{const {error}=await sb.rpc("dah_set_download",{p_id:p.id,p_device:device,p_dl:box.checked});if(error)throw error;const q=pieces.get(p.id);if(q)q.dl=box.checked;openDetail(p.id)}catch{box.checked=!box.checked;box.disabled=false;toast("That setting didn't save. Try again.")}};
    kids.push(el("label",{class:"check"},box,el("span",{text:"Let people download this picture"})));
  }
  if(mine){
    const rm=el("button",{class:"btn danger",type:"button",text:"Take it down"});
    rm.onclick=()=>{if(rm.dataset.sure){rm.disabled=true;takeDown(p)}else{rm.dataset.sure="1";rm.textContent="Confirm: delete for everyone"}};
    kids.push(el("p",{class:"note",text:"Taking a picture down doesn't give you another hang today."}));
    kids.push(el("div",{class:"row"},rm));
  }
  if(!mine){
    const rp=el("button",{class:"btn",type:"button",text:"Report this picture"});
    rp.onclick=async()=>{
      if(!rp.dataset.sure){rp.dataset.sure="1";rp.textContent="Confirm report";return}
      rp.disabled=true;
      const {error}=await sb.rpc("dah_report",{p_id:p.id,p_device:device});
      if(error){rp.disabled=false;toast("The report didn't send. Try again.");return}
      rp.textContent="Reported";toast("Thanks. Pictures reported by several people are hidden automatically.");
    };
    kids.push(el("div",{class:"row"},rp));
  }
  panel.replaceChildren(...kids);panel.hidden=false;close.focus();
}
async function download(p){
  const b=$("dlBtn");if(b)b.disabled=true;
  try{
    const r=await fetch(blob(p.img));if(!r.ok)throw 0;
    const url=URL.createObjectURL(await r.blob()),ext=p.img.split(".").pop();
    const name=(p.title.replace(/[^\p{L}\p{N} _-]+/gu,"").trim()||"dah-picture").slice(0,80);
    const a=el("a",{href:url,download:`${name}.${ext}`});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch{toast("The download didn't start. Try again.")}
  if(b)b.disabled=false;
}
async function takeDown(p){
  try{
    const {data,error}=await sb.rpc("dah_take_down",{p_id:p.id,p_device:device});
    if(error)throw error;
    if(Array.isArray(data)&&data.length)await sb.storage.from(BUCKET).remove(data).catch(()=>{});
    pieces.delete(p.id);removeEl(p.id);regions.delete(p.id);
    closePanel();soon();draw();toast("Taken down.");
  }catch{toast("That didn't go through. Check your connection and try again.")}
}

/* ---------- hanging a new piece ---------- */
$("addBtn").onclick=$("emptyAdd").onclick=()=>{if(!canHang){toast(noHangReason());return}$("file").click()};
function noHangReason(){return setupMissing?"The wall is still being set up.":"The wall couldn't load. Reload the page and try again."}
$("file").onchange=e=>{takeFiles([...e.target.files]);e.target.value=""};
addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].filter(x=>x.type.startsWith("image/"));if(f.length&&!e.target.closest?.("input,textarea")){e.preventDefault();takeFiles(f)}});
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes("Files");
addEventListener("dragenter",e=>{if(hasFiles(e)){dragDepth++;$("dropveil").hidden=!canHang}});
addEventListener("dragleave",e=>{if(hasFiles(e)&&--dragDepth<=0){dragDepth=0;$("dropveil").hidden=true}});
addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$("dropveil").hidden=true;takeFiles([...e.dataTransfer.files],toWorld(e.clientX,e.clientY))});
function takeFiles(files,at){
  if(!canHang){toast(noHangReason());return}
  if(cooldown()){toast(`You've hung today's picture. Your next one is in ${waitText()}.`);return}
  if(placing){toast("Finish placing this picture first.");return}
  const ok=files.filter(f=>TYPES.has(f.type)&&f.size<=30*1024*1024);
  if(ok.length<files.length)toast("Some files were skipped. Use PNG, JPEG, GIF or WebP up to 30 MB.");
  if(!ok.length)return;
  if(ok.length>1)toast("You can hang one picture a day, so only the first one was kept.");
  queue=[{file:ok[0],at}];
  nextInQueue();
}
function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),i=new Image();i.onload=()=>res({img:i,url});i.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};i.src=url})}
async function nextInQueue(){
  const item=queue.shift();if(!item)return;
  try{
    const {img,url}=await loadImage(item.file);
    const nw=img.naturalWidth||640,nh=img.naturalHeight||640,fit=Math.min(1,640/Math.max(nw,nh));
    const at=item.at||[cam.x,cam.y];
    closePanel();
    placing={file:item.file,img,url,nw,nh,scale:fit,x:0,y:0,clash:false};
    const g=el("div",{class:"ghost"},el("img",{alt:"",src:url,draggable:false}));
    placing.el=g;world.append(g);
    if(cam.z<.25)moveTo(at[0],at[1],.5);
    setGhost(at[0],at[1]);
    buildPlacePanel();updateEmpty();
    if(clashes(placing.x,placing.y))findFree();
  }catch{toast("That image couldn't be read. Try a different file.");nextInQueue()}
}
const gw=()=>Math.round(placing.nw*placing.scale),gh=()=>Math.round(placing.nh*placing.scale);
const overlaps=(list,x,y,w,h)=>list.some(p=>Math.abs(p.x-x)<(p.w+w)/2+GAP&&Math.abs(p.y-y)<(p.h+h)/2+GAP+24);
function clashes(x,y){return overlaps([...pieces.values()],x,y,gw(),gh())}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setGhost(x,y){
  if(!placing)return;
  placing.x=clamp(Math.round(x/10)*10,-LIMIT,LIMIT);placing.y=clamp(Math.round(y/10)*10,-LIMIT,LIMIT);
  const w=gw(),h=gh();placing.el.style.cssText=`left:${placing.x-org.x-w/2}px;top:${-(placing.y-org.y)-h/2}px;width:${w}px;height:${h}px`;
  placing.clash=clashes(placing.x,placing.y);placing.el.classList.toggle("clash",placing.clash);
  const X=$("px"),Y=$("py");
  if(X&&document.activeElement!==X)X.value=placing.x;
  if(Y&&document.activeElement!==Y)Y.value=placing.y;
  const warn=$("pw"),go=$("hang");
  if(warn){warn.hidden=!placing.clash;go.disabled=placing.clash||placing.busy;go.textContent=placing.busy?go.textContent:`Hang at ${plain(placing.x,placing.y)}`}
}
function findFree(){
  if(!placing)return;
  const stepBy=Math.max(gw(),gh())/2+40,ox=placing.x,oy=placing.y;
  for(let ring=1;ring<40;ring++)for(let i=0;i<ring*8;i++){
    const a=i/(ring*8)*Math.PI*2,x=ox+Math.cos(a)*ring*stepBy,y=oy+Math.sin(a)*ring*stepBy;
    if(!clashes(x,y)){setGhost(x,y);fly(placing.x,placing.y,cam.z);return}
  }
}
function buildPlacePanel(){
  const title=el("input",{id:"pt",maxLength:120,placeholder:"Untitled",value:placing.file.name.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").slice(0,120)});
  const artist=el("input",{id:"pa",maxLength:80,value:store.get("artlas.artist"),placeholder:"Your name or handle"});
  const note=el("textarea",{id:"pn",maxLength:600,rows:2,placeholder:"Optional"});
  const x=el("input",{id:"px",type:"number",step:10,value:placing.x}),y=el("input",{id:"py",type:"number",step:10,value:placing.y});
  const size=el("input",{id:"ps",type:"range",min:10,max:100,value:60});
  const maxScale=MAX_SIDE/Math.max(placing.nw,placing.nh),minScale=Math.min(80/Math.max(placing.nw,placing.nh),maxScale);
  const toS=v=>minScale*(maxScale/minScale)**((v-10)/90);
  size.value=clamp(10+90*Math.log(placing.scale/minScale)/Math.log(maxScale/minScale),10,100)||60;
  const sizeLabel=el("span",{class:"eyebrow"});const showSize=()=>sizeLabel.textContent=`Size · ${gw()} × ${gh()} units`;
  size.oninput=()=>{placing.scale=toS(Number(size.value));setGhost(placing.x,placing.y);showSize()};showSize();
  const typed=()=>{const a=Number(x.value),b=Number(y.value);if(num(a)&&num(b)){setGhost(a,b);fly(placing.x,placing.y,cam.z)}};
  x.onchange=typed;y.onchange=typed;
  const field=(label,input)=>el("label",{class:"field"},el("span",{class:"eyebrow",text:label}),input);
  const dl=el("input",{id:"pd",type:"checkbox"});
  const dlRow=el("label",{class:"check"},dl,el("span",{text:"Let people download this picture"}));
  const go=el("button",{id:"hang",class:"btn primary",type:"button",text:"Hang"});
  go.onclick=()=>hang(title.value.trim(),artist.value.trim(),note.value.trim(),dl.checked);
  const warn=el("div",{id:"pw",class:"warn",hidden:true},document.createTextNode("Another piece is already here. "),el("button",{class:"btn",type:"button",text:"Find a free spot",onclick:findFree,style:"margin-top:6px"}));
  const cancel=el("button",{class:"btn",type:"button",text:"Cancel",onclick:cancelPlacing});
  panel.replaceChildren(
    el("div",{class:"eyebrow",text:"Today's picture"}),
    el("h2",{text:"Choose its spot"}),
    el("p",{class:"note",text:"Drag it on the map, or type exact coordinates. It can't cover anyone else's art, and you can hang one picture every 24 hours."}),
    el("div",{class:"two"},field("x",x),field("y",y)),warn,
    el("label",{class:"field"},sizeLabel,size),
    field("Title",title),field("Artist",artist),field("Note",note),dlRow,
    el("div",{id:"pp",class:"note",hidden:true}),
    el("div",{class:"row"},go,cancel));
  panel.hidden=false;setGhost(placing.x,placing.y);title.focus();title.select();
}
function cancelPlacing(){if(!placing)return;placing.el.remove();URL.revokeObjectURL(placing.url);placing=null;closePanel();updateEmpty();nextInQueue()}
function toBlob(cv,type,q){return new Promise(r=>cv.toBlob(r,type,q))}
async function resized(img,nw,nh,maxDim,type,q){const k=Math.min(1,maxDim/Math.max(nw,nh)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(nw*k));c.height=Math.max(1,Math.round(nh*k));
  const x=c.getContext("2d");if(type!=="image/jpeg"){}else{x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);return toBlob(c,type,q)}
const EXT={"image/png":"png","image/jpeg":"jpg","image/gif":"gif","image/webp":"webp"};
async function encode(img,nw,nh,maxDim,q){
  let b=await resized(img,nw,nh,maxDim,"image/webp",q);
  if(!b||b.type!=="image/webp")b=await resized(img,nw,nh,maxDim,"image/jpeg",q);
  return b;
}
const LIMIT_FILE=10*1024*1024;
async function prepare(P){
  const big=Math.max(P.nw,P.nh)>MAX_DIM,t=P.file.type;
  let main=P.file;
  // GIFs stay animated, and small PNGs stay pixel-perfect. Everything else is re-encoded, which also removes hidden photo data such as GPS location.
  if(t==="image/gif"){if(P.file.size>LIMIT_FILE)throw {dah:"That GIF is over 10 MB. Export a smaller one and try again."}}
  else if(!(t==="image/png"&&!big&&P.file.size<=3*1024*1024)){
    main=await encode(P.img,P.nw,P.nh,MAX_DIM,.9);
    for(const dim of [2048,1600]){if(main&&main.size<=LIMIT_FILE)break;main=await encode(P.img,P.nw,P.nh,dim,.8)}
    if(!main||main.size>LIMIT_FILE)throw {dah:"That image is too large even after shrinking it. Export a smaller one and try again."};
  }
  const thumb=(Math.max(P.nw,P.nh)>THUMB*1.3||t==="image/gif")?await encode(P.img,P.nw,P.nh,THUMB,.82):null;
  return {main,thumb};
}
function hangError(e){
  if(e&&e.dah)return e.dah;
  const m=(e&&e.message)||"";
  const lim=/DAH:limit:(\d+)/.exec(m);
  if(lim){nextAt=Date.now()+Number(lim[1])*1000;refreshAdd();return `You've used today's picture. Your next one is in ${waitText()}.`}
  if(m.includes("DAH:overlap"))return "Someone else's art is already here, or someone is hanging a picture here right now. Move yours and try again.";
  if(m.includes("DAH:slow"))return "Too many attempts from this network. Wait an hour and try again.";
  if(m.includes("DAH:busy"))return "The wall is very busy right now. Try again soon.";
  if(m.includes("DAH:expired"))return "That took too long, so your spot was released. Try again.";
  if(m.includes("DAH:noimage"))return "Your image didn't finish uploading. Try again.";
  if(/exceeded|too large|maximum/i.test(m))return "That image is too large. Export a smaller one and try again.";
  return "The upload didn't go through. Check your connection and try again.";
}
async function hang(title,artist,note,dl){
  const P=placing;if(!P||P.busy||P.clash)return;
  P.busy=true;const go=$("hang"),info=$("pp");go.disabled=true;go.textContent="Uploading…";info.hidden=false;info.textContent="Preparing your image…";
  store.set("artlas.artist",artist);
  const done=msg=>{P.busy=false;info.textContent=msg;if(placing===P){setGhost(P.x,P.y);go.disabled=P.clash;go.textContent=`Hang at ${plain(P.x,P.y)}`}};
  try{
    const {main,thumb}=await prepare(P);
    info.textContent="Claiming your spot…";
    const x=P.x,y=P.y,w=gw(),h=gh();
    const c=await sb.rpc("dah_claim",{p_device:device,p_x:x,p_y:y,p_w:w,p_h:h,p_img_ext:EXT[main.type]||"png",p_thumb_ext:thumb?EXT[thumb.type]:null,p_title:title,p_artist:artist,p_note:note,p_dl:dl});
    if(c.error)throw c.error;
    const store_=sb.storage.from(BUCKET);
    info.textContent="Uploading your image…";
    const opts=b=>({contentType:b.type,upsert:false,cacheControl:"31536000"});
    if(thumb){const r=await store_.upload(c.data.thumb,thumb,opts(thumb));if(r.error)throw r.error}
    const r=await store_.upload(c.data.img,main,opts(main));if(r.error)throw r.error;
    info.textContent="Hanging it on the wall…";
    const pub=await sb.rpc("dah_publish",{p_claim:c.data.claim,p_device:device});
    if(pub.error)throw pub.error;
    const p=clean(pub.data);if(p){pieces.set(p.id,p);addIndex(pub.data)}
    nextAt=Date.now()+DAY;
    if(placing===P){P.el.remove();URL.revokeObjectURL(P.url);placing=null;closePanel()}
    total=(total||0)+1;refreshCount();refreshAdd();soon();draw();
    toast(`Hung at ${plain(x,y)}.`);
  }catch(e){done(hangError(e))}
}

/* ---------- start ---------- */
addEventListener("resize",resize);
new MutationObserver(readCss).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readCss);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
readCss();
const h=readHash();if(h){cam.x=clamp(h.x,-LIMIT,LIMIT);cam.y=clamp(h.y,-LIMIT,LIMIT);if(h.z)cam.z=clamp(h.z,MIN_Z,MAX_Z)}
resize();moveTo(cam.x,cam.y,cam.z);
updateEmpty();
(async()=>{
  try{
    let saved=store.get("dah.device");
    if(!/^[0-9a-f]{64}$/.test(saved)){saved=[...crypto.getRandomValues(new Uint8Array(32))].map(b=>b.toString(16).padStart(2,"0")).join("");store.set("dah.device",saved)}
    device=saved;
    const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(device));
    me.owner=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
    // No sign-in: this stays separate from any Brickyard account in the same browser.
    sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:2}}});
    canHang=true;
  }catch{connecting=false;updateEmpty();refreshAdd();setStatus("The wall couldn't load. Reload the page.");return}
  refreshAdd();
  await Promise.all([loadIndex(),loadCount(),loadStatus()]);
  subscribeLive();syncSubs();
  setInterval(refreshAdd,30000);
  setInterval(()=>{if(indexFailed||setupMissing)loadIndex()},15000);
})();
})();
